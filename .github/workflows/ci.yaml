name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v3
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          uvx pip-audit -r requirements.txt --strict
          uvx pip-audit -r mcp_bacen/requirements.txt --strict

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Lint (ruff)
        run: make lint
      - name: Offline unit & contract tests
        run: make test
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt & validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  eval:
    needs: [security, test]
    if: github.event_name != 'pull_request' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_LOCATION: us-central1
      GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ vars.MCP_AUDIENCE }}
          id_token_include_email: true
      - uses: astral-sh/setup-uv@v3
      - run: uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Golden-dataset evaluation (regression gate)
        env:
          MCP_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: make eval

  deploy:
    needs: eval
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_LOCATION: us-central1
      GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: astral-sh/setup-uv@v3
      - run: uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Deploy to Agent Runtime (idempotent by display_name)
        run: make deploy PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
      - name: Post-deploy E2E suite (user stories E1-E10)
        run: make e2e PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e_results.json
          if-no-files-found: ignore
